[project]
name = "strava-js"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "requests>=2.31",
    "google-auth>=2.0",
    "gunicorn>=21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
